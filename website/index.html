    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn Python Peacefully - LPP</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg , #1a0033, #5c327b , #8c4cf6);
            min-height: 100vh;
            font-family: 'Courier New' , monospace;
            color: white;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .panel {
            background : rgba(255 , 255 , 255 , 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255 , 255 , 255 , 0.25);
            border-radius:  2px;
            box-shadow: 0 8px 32px rgba(0 , 0 , 0 , 0.3);
            
            width: 700px;
            padding: 100px;
            text-align: center;
        }
        
        .typewriter {
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid #fff;
            width: 0;
            animation: typing 3s steps(22 , end) forwards,
            blink 0.7s step-end infinite;
            margin: 0 auto; 
        }
        @keyframes typing{
            from {width: 0;}
            to {width : 100%;}
        }
        @keyframes blink {
            50% { border-color: transparent;}
        }

        .start-btn {
            display: inline-block;
            padding: 14px  45px;
            background: linear-gradient(135deg , #ff6ec7 , #a855f7);
            color: white;
            border-radius:  50px;
            text-decoration: none;
            transition: transform 0.2s , box-shadow 0.2s;
            margin-top: 30px;
        }
        .start-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(168 , 85 , 247 , 0.5);
        }
        .footer-content {
    color: #00ff00; /
}

}

.github-support-link {

    display: inline-flex; 
    align-items: center;
    gap: 8px; 
}

.github-support-link:hover {
    color: #00cc00;
}
     </style>
</head>
